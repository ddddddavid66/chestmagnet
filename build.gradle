plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
version = '1.2.7'
group = 'dev.chestmagnet'
base { archivesName = 'chestmagnet-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach { property 'mixin.env.remapRefMap', 'true'; property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath; if (file('tools/assets').exists()) lazyToken('assets_root') { project.file('tools/assets').absolutePath }; args '--mixin', 'chestmagnet.mixins.json'; workingDirectory project.file('run'); mods { chestmagnet { source sourceSets.main } } }
        client { if(project.hasProperty('inputCheck')) property 'chestmagnet.inputCheck','true'; if(project.hasProperty('sourceSmoke')) {property 'chestmagnet.smoke','true';property 'chestmagnet.sourceSmoke','true'; if(project.hasProperty('errorSmoke')) property 'chestmagnet.errorSmoke','true'}; args '--username', 'MagnetTest', '--width', '1100', '--height', '760'; if(project.hasProperty('renderSmoke')) { property 'chestmagnet.smoke','true';property 'chestmagnet.renderSmoke','true' }; if(project.hasProperty('clientSmoke')) { args '--quickPlaySingleplayer','StructureSmoke'; property 'chestmagnet.smoke','true' } }
        server { args '--nogui' }
        gameTestServer { if(project.hasProperty('minimal')) workingDirectory project.file('run/minimal-120'); property 'forge.enabledGameTestNamespaces', 'chestmagnet' }
    }
}
repositories {
    if (project.hasProperty('launcherLibraries')) maven { url = uri(project.property('launcherLibraries')); metadataSources { artifact() } }
    mavenCentral()
    flatDir { dirs 'libs' }
}
dependencies {
    def questVersion = project.hasProperty('qa126Old') ? '2001.4.13' : '2001.4.22'
    def optional126 = ["ftb-quests-forge:${questVersion}", 'beyonddimensions:0.8.9']
    optional126.each { compileOnly fg.deobf("local:${it}") }
    if (project.hasProperty('qa126')) {
        (optional126 + ['compixel:0.1.18', 'architectury:9.2.14-forge',
            'ftb-teams-forge:2001.3.1',
            'ftb-library-forge:' + (project.hasProperty('qa126Old') ? '2001.2.9' : '2001.2.12'),
            'ftb-xmod-compat-forge:2.1.3']).each { runtimeOnly fg.deobf("local:${it}") }
    }
    minecraft "net.minecraftforge:forge:1.20.1-${project.findProperty('forgeVersion') ?: '47.4.10'}"
    if(project.hasProperty('withCompass')) runtimeOnly fg.deobf('local:explorer:1.3.4')
    def storage = project.hasProperty('qa125Legacy')
        ? ['backpacks:3.20.17.1150','core:0.7.8.786','lootr:0.7.31.77']
        : ['backpacks:3.24.35.1675','core:1.3.21.1676','lootr:0.7.35.94']
    (storage + ['rs:1.12.4','rsaddons:0.10.0','curios:5.14.1']).each {
        compileOnly fg.deobf("local:${it}")
        if (!project.hasProperty("minimal")) runtimeOnly fg.deobf("local:${it}")
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
jar { from('LICENSE'); manifest.attributes('MixinConfigs': 'chestmagnet.mixins.json'); finalizedBy 'reobfJar' }
tasks.register('dist', Copy) { dependsOn 'build'; from tasks.jar; into 'dist' }

if (project.hasProperty('verification')) {
    sourceSets.main.java.srcDir 'src/verification/java'
    sourceSets.main.resources.srcDir 'src/verification/resources'
}
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn 'createSrgToMcp' }

if (project.hasProperty('minimal')) sourceSets.main.java.exclude '**/MagnetTests.java'
else sourceSets.main.java.exclude '**/MinimalTests.java'

if (!project.hasProperty('withCompass')) sourceSets.main.java.exclude '**/StructureTests.java'

if(project.hasProperty("lockedFixtures")){dependencies { ["tetra:${project.findProperty('tetraVersion') ?: '6.12.0'}","mutil:6.2.0","aether-1.20.1:1.4.2-neoforge","aquamirae:6.API15","obscure_api:15"].each {runtimeOnly fg.deobf("local:${it}")} }}

if(project.hasProperty("tetraPatches")){dependencies { ["tetra_modify:1.0.10","tetra_inherit:1.0.0"].each {runtimeOnly fg.deobf("local:${it}")} }}

if(project.hasProperty("boosterVersion")){dependencies { runtimeOnly fg.deobf("local:rsbooster:${project.property('boosterVersion')}") }}

if(project.hasProperty("rangeOnly")){ fileTree("src/verification/java").matching {include "**/*Tests.java"}.each { if(!(it.name in ["RsWirelessTests.java", "RsNetworkTests.java"])) sourceSets.main.java.exclude "**/${it.name}" } }

if(project.hasProperty('compat123')) {
 sourceSets.main.java.exclude '**/Client*Checks.java'
 fileTree('src/verification/java').matching {include '**/*Tests.java'}.each {if(it.name != 'CompatibilityTests.java')sourceSets.main.java.exclude '**/'+it.name}
 minecraft.runs.gameTestServer.workingDirectory = project.file('run/compat123-'+(project.findProperty('compassCase') ?: 'none'))
 if(project.hasProperty('compassVersion')) dependencies {runtimeOnly fg.deobf("local:compatcompass:${project.property('compassVersion')}")}
 if(project.hasProperty('goetyVersion')) dependencies {runtimeOnly fg.deobf("local:compatgoety:${project.property('goetyVersion')}")}
 if(project.hasProperty('oldStorage')) { configurations.runtimeClasspath.exclude group:'local', module:'backpacks'; configurations.runtimeClasspath.exclude group:'local', module:'core'; dependencies {runtimeOnly fg.deobf('local:compatbackpacks:old'); runtimeOnly fg.deobf('local:compatcore:old')} }
}

// 1.2.4 验证目录与已有世界隔离；只运行本次相关测试。
if (project.hasProperty('qa124')) {
    minecraft.runs.configureEach { workingDirectory project.file('run/qa124-' + (project.hasProperty('minimal') ? 'minimal' : 'rs') + '-' + (project.findProperty('forgeVersion') ?: '47.4.10')) }
    fileTree('src/verification/java').matching { include '**/*Tests.java' }.each {
        if (!(it.name in (project.hasProperty('minimal') ? ['MinimalTests.java', 'StructureSpeedTests.java'] : ['RsNetworkTests.java', 'RsWirelessTests.java']))) sourceSets.main.java.exclude '**/' + it.name
    }
}

if (project.hasProperty('qa125')) {
    minecraft.runs.configureEach {
        workingDirectory project.file('run/qa125-' + (project.hasProperty('minimal') ? 'minimal'
            : project.hasProperty('qa125Legacy') ? 'legacy' : 'current-' + (project.findProperty('boosterVersion') ?: 'none')))
    }
    fileTree('src/verification/java').matching { include '**/*Tests.java' }.each {
        if (!(it.name in (project.hasProperty('minimal')
            ? ['MinimalTests.java', 'NearbyTests.java']
            : project.hasProperty('rangeOnly') ? ['RsNetworkTests.java', 'RsWirelessTests.java']
            : ['MagnetTests.java', 'NearbyTests.java']))) sourceSets.main.java.exclude '**/' + it.name
    }
}

if (project.hasProperty('rsClient')) {
    minecraft.runs.client {
        property 'chestmagnet.rsClient', 'true'
        if (project.hasProperty('qaDisk')) property 'chestmagnet.qaDisk', project.property('qaDisk')
        args '--quickPlaySingleplayer', 'RsQa124'
    }
}

if (project.hasProperty('verification')) {
    tasks.named('processResources') {
        doLast {
            file("$destinationDir/META-INF/mods.toml").append('\n[[mods]]\nmodId="rsqa124"\nversion="1"\ndisplayName="RS QA (test only)"\n', 'UTF-8')
        }
    }
}

if (!project.hasProperty('qa126')) {
    sourceSets.main.java.exclude '**/Storage126Tests.java', '**/Production126Quests.java'
}
if (project.hasProperty('qa126')) {
    // Compixel with-Kotlin 已提供 JetBrains 注解，避免 ForgeGradle 开发启动重复导出包。
    configurations.configureEach { exclude group: 'org.jetbrains', module: 'annotations' }
    minecraft.runs.configureEach {
        workingDirectory project.file('run/qa126-' + (project.findProperty('forgeVersion') ?: '47.4.10')
            + (project.hasProperty('qa126Old') ? '-legacy' : '-current'))
    }
    fileTree('src/verification/java').matching { include '**/*Tests.java' }.each {
        if (!(it.name in ['Storage126Tests.java', 'NearbyTests.java'])) sourceSets.main.java.exclude '**/' + it.name
    }
}

// 仅为最低版本探测生成测试用 manifest；正式构建不会由命令行悄悄降低门槛。
if (project.hasProperty('verification') && project.hasProperty('qa126ForgeFloor')) {
    tasks.named('processResources') {
        doLast {
            def probe = project.findProperty('forgeVersion')
            if (!(probe in ['47.2.18', '47.3.0'])) throw new GradleException('unexpected Forge probe version')
            def manifest = file("$destinationDir/META-INF/mods.toml")
            manifest.setText(manifest.getText('UTF-8').replace('[47.2.18,48)', "[${probe},48)"), 'UTF-8')
        }
    }
}
