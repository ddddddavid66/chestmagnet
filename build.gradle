import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.2.8'
group = 'dev.chestmagnet'
base { archivesName = 'chestmagnet-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def locked = new JsonSlurper().parse(file('docs/neoforge-upstream-lock.json'))
def compileMods = ['backpacks', 'core', 'rs', 'beyond', 'curios', 'ftbquests', 'lootr']
def runtimeMods = (findProperty('testMods') ?: '').split(',').findAll { !it.isBlank() }
repositories {
    exclusiveContent {
        forRepository { maven { url = uri('https://cursemaven.com') } }
        filter { includeGroup('curse.maven') }
    }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
def remotePins = [:]
def addPinned = { config, name ->
    def entry = locked.dependencies.find { it.name == name && it.sha256 }
    if (entry == null) throw new GradleException("Missing verified upstream entry: $name")
    def local = file("libs/neoforge/${name}.jar")
    if (local.isFile()) {
        if (MessageDigest.getInstance('SHA-256').digest(local.bytes).encodeHex().toString() != entry.sha256)
            throw new GradleException("Unexpected SHA-256: $local")
        dependencies.add(config, files(local))
    } else {
        remotePins[entry.maven] = entry.sha256
        dependencies.add(config, entry.maven)
    }
}
compileMods.each { addPinned('compileOnly', it) }
runtimeMods.each { addPinned('localRuntime', it) }

neoForge {
    version = project.findProperty('neoForgeVersion') ?: locked.neoForge
    runs {
        client { client(); gameDirectory = file('run/neoforge-client') }
        server { server(); gameDirectory = file('run/neoforge-server'); programArgument '--nogui' }
    }
    mods { chestmagnet { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21; options.compilerArgs.add('-Xmaxerrs'); options.compilerArgs.add('500') }
jar {
    from 'LICENSE'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('dist', Copy) {
    dependsOn 'build'
    from tasks.jar
    into 'dist'
    doLast {
        def out = file("dist/${tasks.jar.archiveFileName.get()}")
        def hash = MessageDigest.getInstance('SHA-256').digest(out.bytes).encodeHex().toString()
        file("dist/${out.name}.sha256").text = hash + '  ' + out.name + '\n'
    }
}

// Device tests run against the standalone production JAR, not the development source set.
sourceSets {
    neoforgeQa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('neoforgeQaJar', Jar) {
    from sourceSets.neoforgeQa.output
    archiveFileName = 'chestmagnet-neoforge-qa.jar'
    destinationDirectory = layout.buildDirectory.dir('qa')
}

['ftbteams', 'ftblibrary'].each { addPinned('neoforgeQaCompileOnly', it) }


// Maven fallback must match the same checksums as the manually prepared JARs.
configurations.configureEach { cfg ->
    if (!cfg.canBeResolved) return
    cfg.incoming.afterResolve {
        cfg.incoming.artifacts.artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                def expected = remotePins["${id.group}:${id.module}:${id.version}"]
                if (expected && MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString() != expected)
                    throw new GradleException("SHA-256 mismatch for ${id.displayName}")
            }
        }
    }
}
